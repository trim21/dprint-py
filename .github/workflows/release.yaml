name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build_wheels.yaml

  release:
    name: Release
    runs-on: ubuntu-slim
    needs: build
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true

      - run: uv publish --no-progress
